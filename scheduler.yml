# Where events come from; fetched with ETag revalidation
database: https://blr.today/api/events.db
bluesky:
  pds: https://eurosky.social
  feed:
    handle: events.blr.today
    # Everything except events on these blr.today calendars
    exclude: [unwanted]
    # Posted before other events, so a busy week drops those instead
    priority: [curated]
  # Last Call replies come from their own account, so people can mute it
  last_call:
    handle: lastcall.blr.today
  reposters:
    - handle: indiranagar.blr.today
      calendar: indiranagar
    - handle: curated.blr.today
      calendar: curated
    - handle: cbd.blr.today
      calendar: cbd
    - handle: free.blr.today
      tags: [FREE]
fedi:
  server: https://fedi.blr.today
  # Post exactly what the Bluesky firehose posted, read from its ledger
  mirror: bluesky
  feed:
    account: events
    exclude: [unwanted]
  last_call:
    account: lastcall
  reposters:
    - {account: curated, calendar: curated}
    - {account: indiranagar, calendar: indiranagar}
    - {account: cbd, calendar: cbd}
    - {account: whitefield, calendar: whitefield}
    - {account: koramangala, calendar: koramangala}
    - {account: north, calendar: north}
    - {account: hsr, calendar: hsr}
    - {account: jpnagar, calendar: jpnagar}
    - {account: jayanagar, calendar: jayanagar}
    - {account: fitness, calendar: fitness}
    - {account: books, calendar: bookstores}
    - {account: underline, calendar: underline}
    - {account: bic, calendar: bic}
    - {account: sabha, calendar: sabha}
    - {account: scigallery, calendar: scigallery}
    - {account: rangashankara, calendar: rangashankara}
    - {account: afbangalore, calendar: afbangalore}
    - {account: fillum, calendar: fillum}
    - {account: free, tags: [FREE]}
    - {account: budget, tags: [BUDGET]}
    - {account: workshops, types: [EducationEvent]}
    - {account: sports, types: [SportsEvent]}
    - {account: food, calendar: food}
    - {account: music, calendar: music}
    - {account: film, calendar: films}
    - {account: boardgames, calendar: boardgames}
    - {account: comedy, calendar: comedy}
    - {account: couples, calendar: couples}
    - {account: crafts, calendar: crafts}
    - {account: dance, calendar: dance}
    - {account: kids, calendar: kids}
    - {account: outdoors, calendar: outdoors}
    - {account: quizzing, calendar: quizzing}
    - {account: stage, calendar: stage}
digest:
  listmonk: https://lists.blr.today
  # Same events the social feeds leave out
  exclude: [unwanted]
  # SES has no production access yet, so only draft campaigns
  send: false
